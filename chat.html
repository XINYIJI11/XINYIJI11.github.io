<!doctype html>
<html lang="zh-CN"><head><link rel="stylesheet" href="./account.css"><script src="./backend-config.js" defer></script><script src="./account.js" defer></script><script src="./cloud.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>肉包 · 一心问道</title><link rel="stylesheet" href="./chat.css"><script src="./web-sources.js" defer></script><script src="./chat.js" defer></script><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E🥟%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./video-background.css"><script src="./video-background.js" defer></script></head>
<body><div class="chat-app"><aside class="threads"><a class="back" href="./">← 一心问道</a><div class="brand"><span class="bun">🥟</span><div><strong class="assistant-name">肉包</strong><small>你的科研讨论伙伴</small></div></div><button id="new-thread" class="primary">＋ 新的讨论</button><div class="list-label">最近的讨论 · 云端保存</div><nav id="thread-list" aria-label="历史会话"></nav><button id="settings-open" class="settings-button">⚙ 称呼与长期偏好</button></aside>
<main><header><div><h1 id="thread-title">和肉包聊聊</h1><span id="connection">正在连接…</span></div><div class="header-actions"><button id="export-thread">导出</button><button id="delete-thread">删除会话</button></div></header><div id="messages" class="messages" aria-live="polite"><div class="welcome"><span class="big-bun">🥟</span><h2>把研究中的疑问，说给肉包听。</h2><p>拆解一个方法，推敲一次实验，或把尚未成形的想法聊清楚。</p><div class="starters"><button data-prompt="我想和你一起梳理研究方向。请先问我三个最关键的问题。">梳理研究方向</button><button data-prompt="帮我审视实验方案。你需要我提供哪些信息，才能判断基线、指标和消融是否充分？">推敲实验方案</button><button data-prompt="我正在读一篇论文，想请你帮助理解方法。我应该提供哪些段落或公式？">讨论论文方法</button></div></div></div><div class="compose"><p id="chat-status" role="status"></p><button id="retry" hidden>重试上一条问题</button><div class="web-search-controls"><label><input type="checkbox" id="chat-web-search"> 联网检索公开文献</label><input id="chat-search-query" maxlength="200" placeholder="搜索词（开启联网时填写）" aria-label="联网搜索词" hidden></div><form id="chat-form"><textarea id="question" rows="3" maxlength="12000" placeholder="肉包，我有一个科研问题…" aria-label="输入科研问题" required></textarea><div class="compose-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" class="primary" type="submit">发送 ↑</button></div></form><p class="fine-print">会话与偏好云端保存，仅本人可见。每次携带最近 40 条、最多 6 万字上下文；不会自动读取科研日志。联网仅检索 Crossref 公开题录与摘要，搜索词会发送给检索服务；检索来源会随回答保存。</p></div></main></div>
<dialog id="settings"><form id="settings-form"><div class="dialog-title"><h2>让肉包更了解你</h2><button type="button" id="settings-close" aria-label="关闭设置">×</button></div><label>你想叫它什么<input id="assistant-name" maxlength="24" value="肉包" required></label><label>你的科研背景<textarea id="background" maxlength="3000" rows="4" placeholder="例如：研究方向、正在推进的课题、常用工具…"></textarea></label><label>长期回答偏好<textarea id="instructions" maxlength="3000" rows="3" placeholder="例如：先给直觉解释，再列公式；指出实验中可能遗漏的对照…"></textarea></label><label>回答深度<select id="detail"><option value="concise">简洁直接</option><option value="balanced">适中，按问题展开</option><option value="detailed">详细推导与解释</option></select></label><p>固定使用 DeepSeek V4.1 Flash，密钥由服务端安全保存。以上偏好会随问题发送给 DeepSeek。</p><p id="settings-status" role="status"></p><button class="primary" id="settings-save">保存到云端</button></form></dialog></body></html>
